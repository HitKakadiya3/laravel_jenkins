services:
  app:
    image: hitendra369/laravel-jenkins:latest  # Use your Jenkins-built image
    container_name: laravel_app
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/var/www/app/storage  # Only mount storage for persistence
      - ./bootstrap/cache:/var/www/app/bootstrap/cache
    networks:
      - appnet
    depends_on:
      - db
    working_dir: /var/www/app
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=laravel_jenkins_test
      - DB_USERNAME=laravel_jenkins_test_user
      - DB_PASSWORD=Xdbhe5paAdQnb9vMPEiuO1SRDjwclDRK
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:stable
    container_name: laravel_nginx
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    # Ensure nginx/default.conf contains:
    # location / {
    #     proxy_pass http://app:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

  db:
    image: postgres:15
    container_name: laravel_db
    environment:
      POSTGRES_DB: laravel_jenkins_test
      POSTGRES_USER: laravel_jenkins_test_user
      POSTGRES_PASSWORD: Xdbhe5paAdQnb9vMPEiuO1SRDjwclDRK
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - appnet

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    networks:
      - appnet

volumes:
  dbdata:
  jenkins_home:

networks:
  appnet:
    driver: bridge
